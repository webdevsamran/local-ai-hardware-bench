[package]
name = "aihwbench-desktop"
version = "0.2.0"
description = "Desktop wrapper around the aihwbench CLI and dashboard"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
