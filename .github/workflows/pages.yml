# Deploys the React dashboard (web/) to GitHub Pages.
#
# Requires the repository setting Pages → Source = "GitHub Actions".
# If deployment fails with a permissions error, that single setting is the
# remaining manual step; everything else is fully configured here.

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "results/published/**"
      - "web/**"
      - "scripts/generate_frontend_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate static dataset
        run: python scripts/generate_frontend_data.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit

      - name: Build production bundle
        working-directory: web
        env:
          VITE_BASE_PATH: /local-ai-hardware-bench/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
