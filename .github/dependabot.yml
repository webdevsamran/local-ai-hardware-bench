version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must move together: CodeQL refuses a version-skewed
      # pair with "Loaded a configuration file for version 'X', but running
      # version 'Y'". Ungrouped, Dependabot opens one PR per sub-action and
      # neither can pass on its own -- that is what stalled #47 and #48.
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 is not installable here yet: typescript-eslint declares
      # `peer typescript@">=4.8.4 <6.1.0"`, and 8.69.0 is its latest release,
      # so `npm ci` fails with ERESOLVE before anything compiles. Dependabot
      # reopens this bump as soon as it is declined and will keep doing so
      # weekly. Remove once a typescript-eslint release supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
