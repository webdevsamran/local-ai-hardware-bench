[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihwbench"
version = "0.1.0"
description = "Open Local AI Hardware Benchmark - vendor-neutral benchmarking of local AI runtimes across CPUs, GPUs, NPUs, and edge accelerators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Local AI Hardware Benchmark contributors" }]
keywords = [
    "benchmark", "llm", "inference", "ollama", "llama.cpp",
    "onnxruntime", "openvino", "npu", "gpu", "edge-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Benchmark",
]
dependencies = []

[project.optional-dependencies]
telemetry = ["psutil>=5.9"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "psutil>=5.9",
]

[project.scripts]
aihwbench = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"