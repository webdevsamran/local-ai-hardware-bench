name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned to the same version .pre-commit-config.yaml uses. Unpinned,
      # this installed whatever was newest (0.16.x) while pre-commit ran
      # 0.11.13, so `ruff format` locally and `ruff format --check` here
      # disagreed about the same file.
      - run: pip install ruff==0.16.4
      - name: Published API description matches the served data
        run: python scripts/generate_openapi.py --check
      - name: Published comparability rubric matches the classifier
        run: python scripts/generate_comparability_rubric.py --check
      - name: Model zoo page matches the manifest
        # The page states licence terms. A licence table describing a previous
        # version of the manifest is worse than none, because a reader acts on
        # it.
        run: python scripts/generate_model_zoo_docs.py --check
      - name: Landscape table matches the fetched competitor data
        # The table states its own method ("fetched via the GitHub API")
        # but was typed by hand. In a sibling repo that drifted into
        # publishing that a live competitor's repo was gone.
        run: python scripts/generate_landscape.py --check
      - name: Secret scan
        # This repo had npm audit and security-extended CodeQL but no secret
        # scanning at all, while tooltrace-bench had the reverse. Each of the
        # four had what the others lacked.
        run: python scripts/secret_scan.py
      - name: Pinned actions match their version comments
        # Sixteen `uses:` lines here pinned actions/checkout@3d3c42e5aac5 and
        # called it v7.0.0; that SHA is v7.0.1.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_action_pins.py
      - run: ruff check aihwbench tests scripts
      - run: ruff format --check aihwbench tests scripts

  test:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # pyproject classifies 3.10-3.13; 3.11 was the one gap, so a
        # 3.11 user ran code the matrix never exercised.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
      # The unit suite answers "does this function work". This answers "is the
      # guard wired into the path a user travels" -- which is a different
      # question, and the one every defect in this repository's history came
      # down to.
      - name: Acceptance criteria (guards are reachable, not merely present)
        run: python scripts/acceptance_check.py

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-cov
      - run: pytest --cov=aihwbench --cov-branch --cov-report=term --cov-fail-under=68

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # mypy 2.x adopted deliberately (see CHANGELOG): 2.3.1 was run against
      # the full package and reported no issues, so the CI-side pin that held
      # this at 1.x is gone. The range now comes from pyproject alone -- an
      # override here would hide exactly the drift it was meant to catch.
      - run: pip install -e ".[dev]"
      - run: mypy aihwbench

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  docs:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_links.py

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Production build
        working-directory: web
        run: npm run build
      # After the build, not instead of it: this runs axe over the prerendered
      # HTML in dist/, which is the artifact a crawler and a screen reader
      # actually receive. A component that passes its unit test and ships a
      # broken landmark structure would clear every step above this one.
      - name: Accessibility (axe-core over prerendered pages)
        working-directory: web
        run: npm run a11y

  dependencies:
    # NOT renamed to mention pip-audit, though it now runs it: this exact
    # string is a required status check in branch protection, matched
    # byte-for-byte. tooltrace-bench spent an entire merge backlog on a
    # renamed required check; a more accurate job name is not worth that.
    name: Dependency review (npm audit + action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (locked)
        working-directory: web
        run: npm ci --no-fund
      - name: npm audit (fail on high+)
        working-directory: web
        run: npm audit --audit-level=high
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package + audit tool
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: pip-audit (fail on any known advisory)
        # The Python surface was entirely unaudited here: npm audit gated the
        # frontend while nothing checked the package's own dependencies.
        run: pip-audit --skip-editable
      # NOTE: dependency-review-action requires the repository setting
      # "Dependency graph" (Settings -> Code security -> Dependency graph),
      # which is UI-only and cannot be enabled via API. Until it is switched
      # on this step is advisory (continue-on-error) and prints instructions;
      # the npm audit gate above remains hard fail-closed.
      - name: Dependency Review (advisory until Dependency graph is enabled)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
      - name: Dependency graph enabled?
        if: always()
        run: |
          echo "If the Dependency Review step above failed with 'Dependency graph"
          echo "is not enabled', enable it in: Settings -> Code security and"
          echo "analysis -> Dependency graph, then remove continue-on-error from"
          echo "the Dependency Review step in .github/workflows/ci.yml."
  data-freshness:
    name: Generated frontend data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate and diff
        run: |
          python scripts/generate_frontend_data.py
          if [ -n "$(git status --porcelain web/public/data)" ]; then
            echo "::error::web/public/data is stale. Run scripts/generate_frontend_data.py and commit."
            git status --porcelain web/public/data
            exit 1
          fi
          echo "Generated frontend data is up to date."

  results:
    name: Result pipeline (schema + privacy + duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[schema]"
      - name: Validate schema, scan privacy, detect duplicate fingerprints
        shell: python
        run: |
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from aihwbench.fingerprint import result_fingerprint
          from aihwbench.formal_schema import validate_formal
          from aihwbench.plausibility import check_plausibility
          from aihwbench.sanitize import scan_object
          from aihwbench.schemas import validate_result
          failures = []
          fingerprints = {}
          checked = 0
          patterns = ("results/published/*.json", "results/normalized/*.json")
          files = [p for pat in patterns for p in sorted(pathlib.Path(".").glob(pat))]
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              errors = validate_result(data)
              # The published JSON Schema is the contract downstream consumers
              # code against; validating only the hand-written semantic rules
              # left it unenforced. validate_formal fails closed when
              # jsonschema is missing, so a broken environment fails the job
              # rather than silently passing every file.
              errors = errors + validate_formal(data)
              # Impossible values -- more VRAM than the card has, a first
              # token after the last one -- are measurement bugs, and a
              # published dataset should not carry them.
              errors = errors + [
                  f"implausible {f['field']}: {f['detail']}"
                  for f in check_plausibility(data)
              ]
              clean, privacy = scan_object(data)
              fp = result_fingerprint(data)
              dup = fingerprints.get(fp)
              fingerprints.setdefault(fp, str(path))
              checked += 1
              status = "OK"
              detail = []
              if errors:
                  status = "FAIL"
                  detail.extend(errors)
              if privacy:
                  status = "PRIVACY_FAIL"
                  detail.extend(privacy)
              if dup:
                  status = "DUPLICATE"
                  detail.append(f"duplicate fingerprint of {dup}")
              print(f"{status}: {path}")
              failures.extend((str(path), d) for d in detail)
          if failures:
              print()
              for path, msg in failures:
                  print(f"{path}: {msg}")
              sys.exit(1)
          print(f"Pipeline-checked {checked} result file(s): schema OK, no privacy issues, no duplicates.")
