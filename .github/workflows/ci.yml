name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check benchmark tests
      - run: ruff format --check benchmark tests

  test:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pytest-cov
      - run: pytest --cov=benchmark --cov-report=term --cov-fail-under=55

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy
      - run: mypy benchmark

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

  docs:
    name: Docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_links.py

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Production build
        working-directory: web
        run: npm run build

  data-freshness:
    name: Generated frontend data is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate and diff
        run: |
          python scripts/generate_frontend_data.py
          if [ -n "$(git status --porcelain web/public/data)" ]; then
            echo "::error::web/public/data is stale. Run scripts/generate_frontend_data.py and commit."
            git status --porcelain web/public/data
            exit 1
          fi
          echo "Generated frontend data is up to date."

  results:
    name: Result pipeline (schema + privacy + duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate schema, scan privacy, detect duplicate fingerprints
        shell: python
        run: |
          import json, pathlib, sys
          sys.path.insert(0, ".")
          from benchmark.fingerprint import result_fingerprint
          from benchmark.sanitize import scan_object
          from benchmark.schemas import validate_result
          failures = []
          fingerprints = {}
          checked = 0
          patterns = ("results/published/*.json", "results/normalized/*.json")
          files = [p for pat in patterns for p in sorted(pathlib.Path(".").glob(pat))]
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              errors = validate_result(data)
              clean, privacy = scan_object(data)
              fp = result_fingerprint(data)
              dup = fingerprints.get(fp)
              fingerprints.setdefault(fp, str(path))
              checked += 1
              status = "OK"
              detail = []
              if errors:
                  status = "FAIL"
                  detail.extend(errors)
              if privacy:
                  status = "PRIVACY_FAIL"
                  detail.extend(privacy)
              if dup:
                  status = "DUPLICATE"
                  detail.append(f"duplicate fingerprint of {dup}")
              print(f"{status}: {path}")
              failures.extend((str(path), d) for d in detail)
          if failures:
              print()
              for path, msg in failures:
                  print(f"{path}: {msg}")
              sys.exit(1)
          print(f"Pipeline-checked {checked} result file(s): schema OK, no privacy issues, no duplicates.")
