name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  attestations: write
  contents: read

jobs:
  build:
    name: Build, checksum, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine cyclonedx-bom
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          mv SHA256SUMS.txt dist/SHA256SUMS.txt
      - name: Generate SBOM (CycloneDX)
        # A release security artifact must be produced or the release job
        # fails. We never swallow SBOM failure with a "skipped" echo.
        run: |
          set -e
          pip install .
          cyclonedx-py requirements --output-format json --output-file dist/sbom.json

      - name: Verify SBOM was generated and is valid
        run: |
          set -e
          test -s dist/sbom.json || { echo "::error::dist/sbom.json is empty or missing"; exit 1; }
          python - <<'PY'
          import json
          with open("dist/sbom.json", encoding="utf-8") as fh:
              sbom = json.load(fh)
          assert sbom.get("bomFormat") == "CycloneDX", "SBOM is not a CycloneDX document"
          components = sbom.get("components", [])
          print(f"SBOM valid: {len(components)} component(s), spec {sbom.get('specVersion')}")
          PY
      - name: Attest build provenance (SLSa, #4)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: release-artifacts
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist/
      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "AIHWBench ${GITHUB_REF_NAME}" \
            --generate-notes