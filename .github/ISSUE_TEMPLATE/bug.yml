name: Bug report
description: Report a defect in the CLI, detection, backends, or validation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please include as much
        detail as possible — but never include serial numbers, MAC
        addresses, tokens, or paths containing your username.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `aihwbench ...`
        2. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aihwbench version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware (sanitized)
      description: Output of `aihwbench system-info` (it is sanitized by design).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no serial numbers, MAC addresses, tokens, credentials, or personal paths.
          required: true