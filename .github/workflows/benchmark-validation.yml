# Reusable benchmark validation / regression reporting workflow (#48).
#
# Consumers call this from their own workflows:
#
#   jobs:
#     validate:
#       uses: webdevsamran/local-ai-hardware-bench/.github/workflows/
#         benchmark-validation.yml@main
#       with:
#         results-dir: results/published
#         baseline-name: my-machine
#
# It validates every result against the schema, runs the privacy scan and
# data-quality checks, flags anomalies for review, and — when a baseline
# exists — produces a machine-readable regression verdict plus an optional
# PR summary. No hardware benchmarks run in CI; no models are downloaded.

name: Benchmark validation

on:
  workflow_call:
    inputs:
      results-dir:
        description: Directory containing published result JSON files
        required: false
        default: results/published
        type: string
      baseline-name:
        description: Optional saved baseline name for regression checks
        required: false
        default: ""
        type: string
      python-version:
        required: false
        default: "3.12"
        type: string
      fail-on-validation-failure:
        description: Fail the calling workflow when any result is schema/privacy invalid
        required: false
        default: "true"
        type: boolean
      fail-on-regression:
        description: Fail the calling workflow when the newest candidate regresses vs baseline
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate all results (schema + privacy + quality)
        id: validate
        run: |
          set -e
          verdict="pass"
          failure_reasons=""
          mkdir -p validation-output
          for f in "${{ inputs.results-dir }}"/*.json; do
            [ -e "$f" ] || { echo "No results found in ${{ inputs.results-dir }}" >&2; exit 1; }
            # Hard gate: schema + privacy validation. A non-zero exit flips
            # the verdict (fail-closed, never aggregated away).
            if ! aihwbench validate "$f"; then
              verdict="fail"
              failure_reasons="$failure_reasons\nschema/privacy: $f"
              continue
            fi
            # Quality is advisory but must not crash silently: capture the
            # report to the artifact; a crash also flips the verdict.
            quality_file="validation-output/$(basename "$f").quality.json"
            if ! aihwbench quality "$f" > "$quality_file" 2>&1; then
              verdict="fail"
              failure_reasons="$failure_reasons\nquality-crash: $f"
            fi
          done
          if [ -n "$failure_reasons" ]; then
            echo -e "Validation failures detected:$failure_reasons" >&2
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Anomaly review flags
        run: |
          aihwbench anomalies --results-dir "${{ inputs.results-dir }}" \
            > validation-output/anomalies.json 2> validation-output/anomalies.err
          cat validation-output/anomalies.json

      - name: Select newest candidate (deterministic)
        id: candidate
        shell: python
        run: |
          import json, pathlib
          files = sorted(pathlib.Path("${{ inputs.results-dir }}").glob("*.json"))
          if not files:
              raise SystemExit(f"no result files in ${{ inputs.results-dir }}")
          def ts(p):
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  return str(data.get("timestamp") or "")
              except Exception:
                  return ""
          newest = max(files, key=ts)
          print(newest, file=open("validation-output/candidate.txt", "w", encoding="utf-8"))
          print(f"candidate={newest}")

      - name: Regression check vs baseline
        id: regression
        if: ${{ inputs.baseline-name != '' }}
        run: |
          candidate=$(cat validation-output/candidate.txt)
          set +e
          aihwbench regression --baseline "${{ inputs.baseline-name }}" \
            --json "$candidate" > validation-output/regression.json 2>&1
          reg_exit=$?
          set -e
          echo "regression_exit=$reg_exit" >> "$GITHUB_OUTPUT"
          cat validation-output/regression.json
          exit 0

      - name: Machine-readable verdict
        run: |
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path("validation-output")
          verdict = {"validation": "${{ steps.validate.outputs.verdict }}"}
          anomalies = out / "anomalies.json"
          if anomalies.exists():
              try:
                  data = json.loads(anomalies.read_text())
                  verdict["anomaly_flags"] = len(data.get("flags", []))
              except Exception:
                  verdict["anomaly_flags"] = None
          reg = out / "regression.json"
          if reg.exists():
              try:
                  verdict["regression"] = json.loads(reg.read_text())
              except Exception:
                  verdict["regression"] = {"status": "unreadable"}
          (out / "verdict.json").write_text(json.dumps(verdict, indent=2))
          print(json.dumps(verdict, indent=2))
          PY

      - name: Fail closed on validation verdict
        if: ${{ inputs.fail-on-validation-failure && steps.validate.outputs.verdict == 'fail' }}
        run: |
          echo "::error::Benchmark validation failed (verdict=fail); see artifacts."
          exit 1

      - name: Fail closed on regression
        if: ${{ inputs.fail-on-regression && inputs.baseline-name != '' && steps.regression.outputs.regression_exit != '0' }}
        run: |
          echo "::error::Regression gate failed against baseline '${{ inputs.baseline-name }}'; see validation-output/regression.json."
          exit 1

      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: benchmark-validation
          path: validation-output/

      - name: PR summary
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Benchmark validation"
            echo ""
            echo "- Verdict: \`${{ steps.validate.outputs.verdict }}\`"
            echo "- Results checked: $(ls "${{ inputs.results-dir }}"/*.json 2>/dev/null | wc -l)"
            echo "- Anomaly report: see artifact \`benchmark-validation\`"
          } >> "$GITHUB_STEP_SUMMARY"